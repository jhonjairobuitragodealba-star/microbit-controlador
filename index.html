<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Bluetooth Micro:bit</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .card {
            background: #252538;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            text-align: center;
            width: min(340px, 85%);
        }

        h2 {
            color: #00bcd4;
        }

        #btnConnect {
            background: #ff9800;
            color: white;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .led {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .led button {
            padding: 12px 5px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .on {
            background: #4CAF50;
        }

        .off {
            background: #f44336;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #status {
            margin-top: 18px;
            font-size: 14px;
            color: #ccc;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Control Micro:bit</h2>

        <button id="btnConnect" onclick="conectarBluetooth()">
            Conectar Bluetooth
        </button>

        <div class="led">
            <button class="on" data-cmd="A" disabled>LED 1 · Encender</button>
            <button class="off" data-cmd="B" disabled>LED 1 · Apagar</button>

            <button class="on" data-cmd="C" disabled>LED 2 · Encender</button>
            <button class="off" data-cmd="D" disabled>LED 2 · Apagar</button>

            <button class="on" data-cmd="E" disabled>LED 3 · Encender</button>
            <button class="off" data-cmd="F" disabled>LED 3 · Apagar</button>

            <button class="on" data-cmd="G" disabled>LED 4 · Encender</button>
            <button class="off" data-cmd="H" disabled>LED 4 · Apagar</button>

            <button class="on" data-cmd="I" disabled>LED 5 · Encender</button>
            <button class="off" data-cmd="J" disabled>LED 5 · Apagar</button>

            <button class="on" data-cmd="K" disabled>LED 6 · Encender</button>
            <button class="off" data-cmd="L" disabled>LED 6 · Apagar</button>
        </div>

        <p id="status">Estado: Desconectado</p>
    </div>

    <script>
        const UART_SERVICE_UUID =
            "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

        const UART_RX_CHAR_UUID =
            "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let bluetoothDevice;
        let uartRxCharacteristic;

        async function conectarBluetooth() {
            try {
                if (!navigator.bluetooth) {
                    throw new Error(
                        "Usa Chrome o Edge en un dispositivo compatible con Bluetooth."
                    );
                }

                document.getElementById("status").innerText =
                    "Buscando micro:bit...";

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                document.getElementById("status").innerText =
                    "Conectando...";

                const server = await bluetoothDevice.gatt.connect();

                const service =
                    await server.getPrimaryService(UART_SERVICE_UUID);

                // Para ENVIAR comandos se necesita la característica RX.
                uartRxCharacteristic =
                    await service.getCharacteristic(UART_RX_CHAR_UUID);

                document.getElementById("status").innerText =
                    "¡Conectado con éxito!";

                document.getElementById("btnConnect").innerText =
                    "Desconectar Bluetooth";

                activarBotones(true);

                document.getElementById("btnConnect").onclick =
                    desconectarBluetooth;

                bluetoothDevice.addEventListener(
                    "gattserverdisconnected",
                    alDesconectar
                );

            } catch (error) {
                document.getElementById("status").innerText =
                    "Error: " + error.message;
            }
        }

        async function enviarComando(comando) {
            if (!uartRxCharacteristic) return;

            try {
                const datos = new TextEncoder().encode(comando + "#");

                await uartRxCharacteristic.writeValue(datos);

                document.getElementById("status").innerText =
                    "Comando enviado: " + comando;

            } catch (error) {
                document.getElementById("status").innerText =
                    "Error al enviar: " + error.message;
            }
        }

        function activarBotones(estado) {
            document.querySelectorAll(".led button").forEach(boton => {
                boton.disabled = !estado;
            });
        }

        function desconectarBluetooth() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
        }

        function alDesconectar() {
            uartRxCharacteristic = null;

            activarBotones(false);

            document.getElementById("status").innerText =
                "Estado: Desconectado";

            document.getElementById("btnConnect").innerText =
                "Conectar Bluetooth";

            document.getElementById("btnConnect").onclick =
                conectarBluetooth;
        }

        document.querySelectorAll(".led button").forEach(boton => {
            boton.addEventListener("click", () => {
                enviarComando(boton.dataset.cmd);
            });
        });
    </script>
</body>
</html>
