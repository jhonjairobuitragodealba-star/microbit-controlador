<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control Bluetooth Micro:bit</title>

    <style>

        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background: linear-gradient(135deg, #1e1e2f, #2d2d44);

            color: #ffffff;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            height: 100vh;

            margin: 0;

        }

        .card {

            background: #252538;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 8px 20px rgba(0,0,0,0.4);

            text-align: center;

            width: 320px;

        }

        h2 { margin-bottom: 20px; color: #00bcd4; }

        button {

            width: 100%;

            padding: 15px;

            font-size: 18px;

            font-weight: bold;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            margin-top: 10px;

            transition: 0.3s;

        }

        #btnConnect { background-color: #ff9800; color: white; }

        #btnConnect:hover { background-color: #e68900; }

        

        #btnToggle { background-color: #4CAF50; color: white; display: none; }

        #btnToggle.off { background-color: #f44336; }

        

        #status {

            margin-top: 15px;

            font-size: 14px;

            color: #aaa;

        }

    </style>

</head>

<body>



    <div class="card">

        <h2>Control Micro:bit</h2>

        <button id="btnConnect" onclick="conectarBluetooth()">Conectar Bluetooth</button>

        <button id="btnToggle" class="off" onclick="enviarComando()" disabled>ENCENDER LED</button>

        <p id="status">Estado: Desconectado</p>

    </div>



    <script>

        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

        const UART_TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";



        let bluetoothDevice;

        let uartTxCharacteristic;

        let ledEncendido = false;



        async function conectarBluetooth() {

            try {

                document.getElementById('status').innerText = "Buscando micro:bit...";

                

                bluetoothDevice = await navigator.bluetooth.requestDevice({

                    filters: [{ namePrefix: "BBC micro:bit" }],

                    optionalServices: [UART_SERVICE_UUID]

                });



                document.getElementById('status').innerText = "Conectando al servidor GATT...";

                const server = await bluetoothDevice.gatt.connect();



                document.getElementById('status').innerText = "Buscando servicio UART...";

                const service = await server.getPrimaryService(UART_SERVICE_UUID);



                uartTxCharacteristic = await service.getCharacteristic(UART_TX_CHAR_UUID);



                document.getElementById('status').innerText = "¡Conectado con éxito!";

                document.getElementById('btnConnect').style.display = "none";

                document.getElementById('btnToggle').style.display = "block";

                document.getElementById('btnToggle').disabled = false;



                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);



            } catch (error) {

                console.error(error);

                document.getElementById('status').innerText = "Error de conexión: " + error;

            }

        }



        async function enviarComando() {

            if (!uartTxCharacteristic) return;



            let textoAEnviar;

            const boton = document.getElementById('btnToggle');



            if (!ledEncendido) {

                textoAEnviar = "A#"; // Mandamos A con el hashtag que espera MakeCode

                boton.innerText = "APAGAR LED";

                boton.classList.remove('off');

                ledEncendido = true;

            } else {

                textoAEnviar = "B#"; // Mandamos B con el hashtag que espera MakeCode

                boton.innerText = "ENCENDER LED";

                boton.classList.add('off');

                ledEncendido = false;

            }



            try {

                const encoder = new TextEncoder();

                await uartTxCharacteristic.writeValueWithoutResponse(encoder.encode(textoAEnviar));

                console.log("Comando enviado: " + textoAEnviar);

            } catch (error) {

                console.error("Error al enviar dato: ", error);

            }

        }



        function onDisconnected() {

            document.getElementById('status').innerText = "Dispositivo desconectado.";

            document.getElementById('btnConnect').style.display = "block";

            document.getElementById('btnToggle').style.display = "none";

            ledEncendido = false;

        }

    </script>



</body>

</html>
